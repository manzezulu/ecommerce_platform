{% extends 'store/base.html' %}
{% block title %}Forgot password{% endblock %}
{% block content %}
  <div class="form-card">
    <h2>Forgot your password?</h2>
    <p>Enter your account email and we'll send you a reset link.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Send reset link</button>
    </form>
  </div>
{% endblock %}
