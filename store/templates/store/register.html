{% extends 'store/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
  <div class="form-card">
    <h2>Create an account</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </div>
{% endblock %}
