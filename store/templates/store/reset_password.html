{% extends 'store/base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <div class="form-card">
    <h2>Set a new password</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Change password</button>
    </form>
  </div>
{% endblock %}
