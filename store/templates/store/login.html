{% extends 'store/base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
  <div class="form-card">
    <h2>Log in</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Log in</button>
    </form>
    <p><a href="{% url 'forgot_password' %}">Forgot your password?</a></p>
    <p>No account yet? <a href="{% url 'register' %}">Register</a></p>
  </div>
{% endblock %}
