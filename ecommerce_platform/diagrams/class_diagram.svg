<svg viewBox="0 0 1000 620" width="1000" height="620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#f5f6f8"/>
  <text x="500" y="30" font-size="20" font-weight="700" fill="#20242b" text-anchor="middle">Class Diagram — eCommerce Platform</text>

  <!-- User (Django built-in) -->
  <g>
    <rect x="30" y="60" width="190" height="110" fill="#ffffff" stroke="#20242b" stroke-width="2"/>
    <text x="125" y="82" font-size="13" font-weight="700" text-anchor="middle">User</text>
    <text x="125" y="96" font-size="10" text-anchor="middle" fill="#4a4f5a">(django.contrib.auth)</text>
    <line x1="30" y1="104" x2="220" y2="104" stroke="#20242b"/>
    <text x="40" y="120" font-size="10.5">- username, email, password</text>
    <text x="40" y="134" font-size="10.5">- groups: Vendors | Buyers</text>
    <line x1="30" y1="144" x2="220" y2="144" stroke="#20242b"/>
    <text x="40" y="160" font-size="10.5">+ has_perm(codename)</text>
  </g>

  <!-- Store -->
  <g>
    <rect x="270" y="60" width="190" height="130" fill="#ffffff" stroke="#20242b" stroke-width="2"/>
    <text x="365" y="82" font-size="13" font-weight="700" text-anchor="middle">Store</text>
    <line x1="270" y1="94" x2="460" y2="94" stroke="#20242b"/>
    <text x="280" y="110" font-size="10.5">- owner: FK(User)</text>
    <text x="280" y="124" font-size="10.5">- name: CharField(150)</text>
    <text x="280" y="138" font-size="10.5">- description: TextField</text>
    <text x="280" y="152" font-size="10.5">- created_at: DateTimeField</text>
    <line x1="270" y1="162" x2="460" y2="162" stroke="#20242b"/>
    <text x="280" y="178" font-size="10.5">+ __str__() : str</text>
  </g>

  <!-- Product -->
  <g>
    <rect x="510" y="60" width="210" height="150" fill="#ffffff" stroke="#20242b" stroke-width="2"/>
    <text x="615" y="82" font-size="13" font-weight="700" text-anchor="middle">Product</text>
    <line x1="510" y1="94" x2="720" y2="94" stroke="#20242b"/>
    <text x="520" y="110" font-size="10.5">- store: FK(Store)</text>
    <text x="520" y="124" font-size="10.5">- name: CharField(150)</text>
    <text x="520" y="138" font-size="10.5">- price: DecimalField</text>
    <text x="520" y="152" font-size="10.5">- stock: PositiveIntegerField</text>
    <line x1="510" y1="162" x2="720" y2="162" stroke="#20242b"/>
    <text x="520" y="178" font-size="10.5">+ __str__() : str</text>
    <text x="520" y="192" font-size="9.5" fill="#4a4f5a">Meta.permissions: add/change/</text>
    <text x="520" y="203" font-size="9.5" fill="#4a4f5a">delete/view_products</text>
  </g>

  <!-- Order -->
  <g>
    <rect x="30" y="250" width="190" height="110" fill="#ffffff" stroke="#20242b" stroke-width="2"/>
    <text x="125" y="272" font-size="13" font-weight="700" text-anchor="middle">Order</text>
    <line x1="30" y1="284" x2="220" y2="284" stroke="#20242b"/>
    <text x="40" y="300" font-size="10.5">- buyer: FK(User)</text>
    <text x="40" y="314" font-size="10.5">- created_at: DateTimeField</text>
    <text x="40" y="328" font-size="10.5">- total: DecimalField</text>
    <line x1="30" y1="336" x2="220" y2="336" stroke="#20242b"/>
    <text x="40" y="352" font-size="10.5">+ __str__() : str</text>
  </g>

  <!-- OrderItem -->
  <g>
    <rect x="270" y="250" width="210" height="140" fill="#ffffff" stroke="#20242b" stroke-width="2"/>
    <text x="375" y="272" font-size="13" font-weight="700" text-anchor="middle">OrderItem</text>
    <line x1="270" y1="284" x2="480" y2="284" stroke="#20242b"/>
    <text x="280" y="300" font-size="10.5">- order: FK(Order)</text>
    <text x="280" y="314" font-size="10.5">- product: FK(Product, null ok)</text>
    <text x="280" y="328" font-size="10.5">- product_name: CharField</text>
    <text x="280" y="342" font-size="10.5">- quantity: PositiveIntegerField</text>
    <text x="280" y="356" font-size="10.5">- price_at_purchase: Decimal</text>
    <line x1="270" y1="364" x2="480" y2="364" stroke="#20242b"/>
    <text x="280" y="380" font-size="10.5">+ line_total() : Decimal</text>
  </g>

  <!-- Review -->
  <g>
    <rect x="530" y="250" width="200" height="140" fill="#ffffff" stroke="#20242b" stroke-width="2"/>
    <text x="630" y="272" font-size="13" font-weight="700" text-anchor="middle">Review</text>
    <line x1="530" y1="284" x2="730" y2="284" stroke="#20242b"/>
    <text x="540" y="300" font-size="10.5">- product: FK(Product)</text>
    <text x="540" y="314" font-size="10.5">- user: FK(User)</text>
    <text x="540" y="328" font-size="10.5">- rating: PositiveSmallInt (1-5)</text>
    <text x="540" y="342" font-size="10.5">- comment: TextField</text>
    <text x="540" y="356" font-size="10.5">- verified: BooleanField</text>
    <line x1="530" y1="364" x2="730" y2="364" stroke="#20242b"/>
    <text x="540" y="380" font-size="10.5">+ __str__() : str</text>
  </g>

  <!-- PasswordResetToken -->
  <g>
    <rect x="780" y="250" width="190" height="130" fill="#ffffff" stroke="#20242b" stroke-width="2"/>
    <text x="875" y="272" font-size="12.5" font-weight="700" text-anchor="middle">PasswordResetToken</text>
    <line x1="780" y1="284" x2="970" y2="284" stroke="#20242b"/>
    <text x="790" y="300" font-size="10">- user: FK(User)</text>
    <text x="790" y="314" font-size="10">- token: CharField (sha1 hash)</text>
    <text x="790" y="328" font-size="10">- expiry_date: DateTimeField</text>
    <text x="790" y="342" font-size="10">- used: BooleanField</text>
    <line x1="780" y1="352" x2="970" y2="352" stroke="#20242b"/>
    <text x="790" y="368" font-size="10">+ __str__() : str</text>
  </g>

  <!-- Relationships -->
  <g stroke="#20242b" stroke-width="1.4" fill="none">
    <line x1="220" y1="115" x2="270" y2="115"/>
    <line x1="460" y1="120" x2="510" y2="120"/>
    <line x1="125" y1="170" x2="125" y2="250"/>
    <line x1="220" y1="300" x2="270" y2="300"/>
    <line x1="480" y1="300" x2="510" y2="150"/>
    <line x1="220" y1="130" x2="620" y2="300"/>
    <line x1="220" y1="150" x2="780" y2="300"/>
  </g>
  <g font-size="10" fill="#4a4f5a">
    <text x="222" y="112">1</text><text x="262" y="112">*</text>
    <text x="462" y="117">1</text><text x="502" y="117">*</text>
    <text x="130" y="200">1</text><text x="130" y="245">*</text>
    <text x="222" y="297">1</text><text x="262" y="297">*</text>
  </g>

  <text x="30" y="420" font-size="11" fill="#4a4f5a">1 — one · * — many. A Store belongs to one owning User; a Product belongs to one Store;</text>
  <text x="30" y="436" font-size="11" fill="#4a4f5a">an Order belongs to one buying User and has many OrderItems; a Review links one User to one Product;</text>
  <text x="30" y="452" font-size="11" fill="#4a4f5a">a PasswordResetToken belongs to one User.</text>
</svg>
