<svg viewBox="0 0 860 560" width="860" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="560" fill="#f5f6f8"/>
  <text x="430" y="34" font-size="20" font-weight="700" fill="#20242b" text-anchor="middle">Use Case Diagram — eCommerce Platform</text>

  <!-- System boundary -->
  <rect x="260" y="60" width="530" height="470" rx="8" fill="#ffffff" stroke="#20242b" stroke-width="2"/>
  <text x="525" y="84" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">eCommerce Platform</text>

  <!-- Actors -->
  <g transform="translate(50,180)">
    <circle cx="30" cy="0" r="16" fill="none" stroke="#20242b" stroke-width="2"/>
    <line x1="30" y1="16" x2="30" y2="60" stroke="#20242b" stroke-width="2"/>
    <line x1="0" y1="32" x2="60" y2="32" stroke="#20242b" stroke-width="2"/>
    <line x1="30" y1="60" x2="8" y2="95" stroke="#20242b" stroke-width="2"/>
    <line x1="30" y1="60" x2="52" y2="95" stroke="#20242b" stroke-width="2"/>
    <text x="30" y="118" font-size="14" fill="#20242b" text-anchor="middle">Buyer</text>
  </g>

  <g transform="translate(50,400)">
    <circle cx="30" cy="0" r="16" fill="none" stroke="#20242b" stroke-width="2"/>
    <line x1="30" y1="16" x2="30" y2="60" stroke="#20242b" stroke-width="2"/>
    <line x1="0" y1="32" x2="60" y2="32" stroke="#20242b" stroke-width="2"/>
    <line x1="30" y1="60" x2="8" y2="95" stroke="#20242b" stroke-width="2"/>
    <line x1="30" y1="60" x2="52" y2="95" stroke="#20242b" stroke-width="2"/>
    <text x="30" y="118" font-size="14" fill="#20242b" text-anchor="middle">Vendor</text>
  </g>

  <!-- Shared use cases -->
  <g>
    <ellipse cx="440" cy="105" rx="130" ry="28" fill="#C6E2FF" stroke="#20242b" stroke-width="1.5"/>
    <text x="440" y="110" font-size="13" fill="#20242b" text-anchor="middle">Register / Log in</text>
  </g>
  <g>
    <ellipse cx="440" cy="165" rx="130" ry="28" fill="#C6E2FF" stroke="#20242b" stroke-width="1.5"/>
    <text x="440" y="170" font-size="13" fill="#20242b" text-anchor="middle">Reset forgotten password</text>
  </g>
  <g>
    <ellipse cx="440" cy="225" rx="130" ry="28" fill="#C9F2C9" stroke="#20242b" stroke-width="1.5"/>
    <text x="440" y="230" font-size="13" fill="#20242b" text-anchor="middle">Browse products</text>
  </g>

  <!-- Buyer-specific -->
  <g>
    <ellipse cx="440" cy="285" rx="130" ry="28" fill="#FFF4A3" stroke="#20242b" stroke-width="1.5"/>
    <text x="440" y="290" font-size="13" fill="#20242b" text-anchor="middle">Add product to cart</text>
  </g>
  <g>
    <ellipse cx="440" cy="345" rx="130" ry="28" fill="#FFF4A3" stroke="#20242b" stroke-width="1.5"/>
    <text x="440" y="350" font-size="13" fill="#20242b" text-anchor="middle">Checkout (place order)</text>
  </g>
  <g>
    <ellipse cx="440" cy="405" rx="130" ry="28" fill="#FFF4A3" stroke="#20242b" stroke-width="1.5"/>
    <text x="440" y="410" font-size="13" fill="#20242b" text-anchor="middle">Leave a product review</text>
  </g>

  <!-- Vendor-specific -->
  <g>
    <ellipse cx="680" cy="285" rx="130" ry="28" fill="#E5D4FF" stroke="#20242b" stroke-width="1.5"/>
    <text x="680" y="290" font-size="13" fill="#20242b" text-anchor="middle">Manage own store(s)</text>
  </g>
  <g>
    <ellipse cx="680" cy="345" rx="130" ry="28" fill="#E5D4FF" stroke="#20242b" stroke-width="1.5"/>
    <text x="680" y="350" font-size="13" fill="#20242b" text-anchor="middle">Manage store products</text>
  </g>

  <!-- Buyer associations -->
  <line x1="90" y1="180" x2="310" y2="105" stroke="#20242b" stroke-width="1.5"/>
  <line x1="90" y1="180" x2="310" y2="165" stroke="#20242b" stroke-width="1.5"/>
  <line x1="90" y1="180" x2="310" y2="225" stroke="#20242b" stroke-width="1.5"/>
  <line x1="90" y1="180" x2="310" y2="285" stroke="#20242b" stroke-width="1.5"/>
  <line x1="90" y1="180" x2="310" y2="345" stroke="#20242b" stroke-width="1.5"/>
  <line x1="90" y1="180" x2="310" y2="405" stroke="#20242b" stroke-width="1.5"/>

  <!-- Vendor associations -->
  <line x1="90" y1="400" x2="310" y2="105" stroke="#20242b" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="310" y2="165" stroke="#20242b" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="310" y2="225" stroke="#20242b" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="560" y2="285" stroke="#20242b" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="560" y2="345" stroke="#20242b" stroke-width="1.5"/>

  <!-- Legend -->
  <g font-size="11.5" fill="#4a4f5a">
    <rect x="290" y="480" width="14" height="14" fill="#C6E2FF" stroke="#20242b"/>
    <text x="310" y="491">Shared (any account)</text>
    <rect x="290" y="500" width="14" height="14" fill="#FFF4A3" stroke="#20242b"/>
    <text x="310" y="511">Buyer-specific</text>
    <rect x="470" y="480" width="14" height="14" fill="#E5D4FF" stroke="#20242b"/>
    <text x="490" y="491">Vendor-specific</text>
  </g>
</svg>
